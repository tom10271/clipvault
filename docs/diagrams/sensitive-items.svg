<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="478px" preserveAspectRatio="none" style="width:804px;height:478px;background:#FFFFFF;" version="1.1" viewBox="0 0 804 478" width="804px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="9"><text fill="#000000" font-family="Arial" font-size="20" font-weight="700" lengthAdjust="spacing" textLength="495.6738" x="151.0418" y="28.7598">Sensitive values stay hidden until you choose Show</text></g><g class="entity" data-qualified-name="VISIBLE" data-source-line="11" id="ent0001"><rect fill="#E8F5E8" height="52.1973" rx="12.5" ry="12.5" style="stroke:#455A64;stroke-width:0.5;" width="125.8408" x="80.41" y="222.848"/><line style="stroke:#455A64;stroke-width:0.5;" x1="80.41" x2="206.2508" y1="265.0453" y2="265.0453"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="91.041" x="90.41" y="240.9799">Ordinary value</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="105.8408" x="90.41" y="257.0785">Visible by default</text></g><g class="entity" data-qualified-name="SENSITIVE" data-source-line="12" id="ent0002"><path d="M373.42,169.298 L777.2575,169.298 A12.5,12.5 0 0 1 789.7575,181.798 L789.7575,195.3967 L360.92,195.3967 L360.92,181.798 A12.5,12.5 0 0 1 373.42,169.298" fill="#FFEBEE"/><path d="M360.92,195.3967 L789.7575,195.3967 L789.7575,316.0939 A12.5,12.5 0 0 1 777.2575,328.5939 L373.42,328.5939 A12.5,12.5 0 0 1 360.92,316.0939 L360.92,195.3967" fill="#FFEBEE"/><rect fill="none" height="159.2959" rx="12.5" ry="12.5" style="stroke:#455A64;stroke-width:0.5;" width="428.8375" x="360.92" y="169.298"/><line style="stroke:#455A64;stroke-width:0.5;" x1="360.92" x2="789.7575" y1="195.3967" y2="195.3967"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="56.8066" x="546.9354" y="187.4299">Sensitive</text><g class="entity" data-qualified-name="SENSITIVE.HIDDEN" data-source-line="13" id="ent0003"><rect fill="#FFEBEE" height="50" rx="12.5" ry="12.5" style="stroke:#455A64;stroke-width:0.5;" width="101.7373" x="372.92" y="264.4967"/><line style="stroke:#455A64;stroke-width:0.5;" x1="372.92" x2="474.6573" y1="290.5953" y2="290.5953"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="81.7373" x="382.92" y="282.6285">Value hidden</text></g><g class="entity" data-qualified-name="SENSITIVE.SHOWN" data-source-line="14" id="ent0004"><rect fill="#FFF3E0" height="52.1973" rx="12.5" ry="12.5" style="stroke:#455A64;stroke-width:0.5;" width="135.9375" x="629.82" y="263.3967"/><line style="stroke:#455A64;stroke-width:0.5;" x1="629.82" x2="765.7575" y1="305.5939" y2="305.5939"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="115.9375" x="639.82" y="281.5285">Shown temporarily</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="71.5791" x="639.82" y="297.6271">Hides in Ns</text></g><g class="start_entity" data-qualified-name="SENSITIVE..start.SENSITIVE" data-source-line="15" id="ent0005"><ellipse cx="423.79" cy="216.3967" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><!--link *start*SENSITIVE to HIDDEN--><g class="link" data-entity-1="ent0005" data-entity-2="ent0003" data-link-type="dependency" data-source-line="15" id="lnk6"><path d="M423.79,226.6967 C423.79,236.1767 423.79,246.2967 423.79,259.2067" fill="none" id="*start*SENSITIVE-to-HIDDEN" style="stroke:#455A64;stroke-width:1;"/><polygon fill="#455A64" points="423.79,264.2067,427.79,255.2067,423.79,259.2067,419.79,255.2067,423.79,264.2067" style="stroke:#455A64;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link HIDDEN to SHOWN--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="16" id="lnk7"><path d="M474.96,301.3467 C493.38,305.0667 514.39,308.6667 533.74,310.4967 C565.33,313.4867 595.2792,310.8155 624.7292,305.8655" fill="none" id="HIDDEN-to-SHOWN" style="stroke:#455A64;stroke-width:1;"/><polygon fill="#455A64" points="629.66,305.0367,620.1215,302.5838,624.7292,305.8655,621.4475,310.4732,629.66,305.0367" style="stroke:#455A64;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="35.0205" x="534.74" y="306.6285">Show</text></g><!--reverse link HIDDEN to SHOWN--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="17" id="lnk9"><path d="M480,289.4967 C523.61,289.4967 581.61,289.4967 629.5,289.4967" fill="none" id="HIDDEN-backto-SHOWN" style="stroke:#455A64;stroke-width:1;"/><polygon fill="#455A64" points="475,289.4967,484,293.4967,480,289.4967,484,285.4967,475,289.4967" style="stroke:#455A64;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="112.0684" x="496.6712" y="266.6285">10 seconds, Hide,</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="136.9307" x="484.24" y="282.7271">history closes or locks</text></g></g><g class="start_entity" data-qualified-name=".start." data-source-line="20" id="ent0010"><ellipse cx="143.33" cy="79.148" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN15" data-source-line="25" id="ent0016"><path d="M461.32,49.998 L461.32,108.2939 A0,0 0 0 0 461.32,108.2939 L571.33,108.2939 L575.33,169.038 L579.33,108.2939 L689.3532,108.2939 A0,0 0 0 0 689.3532,108.2939 L689.3532,59.998 L679.3532,49.998 L461.32,49.998 A0,0 0 0 0 461.32,49.998" fill="#E3F2FD" style="stroke:#181818;stroke-width:0.5;"/><path d="M679.3532,49.998 L679.3532,59.998 L689.3532,59.9