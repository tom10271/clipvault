<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="547px" preserveAspectRatio="none" style="width:845px;height:547px;background:#FFFFFF;" version="1.1" viewBox="0 0 845 547" width="845px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="9"><text fill="#000000" font-family="Arial" font-size="20" font-weight="700" lengthAdjust="spacing" textLength="394.5313" x="221.8231" y="28.7598">Capture continues while history is locked</text></g><!--cluster ClipVault on your Mac--><g class="cluster" data-qualified-name="ClipVault on your Mac" data-source-line="12" id="ent0002"><rect fill="none" height="382.64" rx="6" ry="6" style="stroke:#181818;stroke-width:1;" width="280" x="220" y="151.098"/><text fill="#000000" font-family="Arial" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="147.0137" x="286.4932" y="166.2299">ClipVault on your Mac</text></g><!--entity CAPTURE--><g class="entity" data-qualified-name="ClipVault on your Mac.CAPTURE" data-source-line="13" id="ent0003"><ellipse cx="388.0033" cy="202.098" fill="#E8F5E8" rx="12" ry="12" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#181818" points="384.0033,190.098,390.0033,185.098,388.0033,190.098,390.0033,195.098,384.0033,190.098" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="49.8066" x="363.1" y="231.2299">Capture</text></g><!--entity INBOX--><g class="entity" data-qualified-name="ClipVault on your Mac.INBOX" data-source-line="14" id="ent0004"><rect fill="#E1F5FE" height="32.0986" rx="6" ry="6" style="stroke:#181818;stroke-width:0.5;" width="116.3926" x="263.8" y="332.388"/><rect fill="#E1F5FE" height="32.0986" rx="6" ry="6" style="stroke:#181818;stroke-width:0.5;" width="116.3926" x="259.8" y="328.388"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="100.3926" x="267.8" y="349.5199">Encrypted inbox</text></g><!--entity HISTORY--><g class="entity" data-qualified-name="ClipVault on your Mac.HISTORY" data-source-line="15" id="ent0005"><rect fill="#E3F2FD" height="52.1973" rx="6" ry="6" style="stroke:#181818;stroke-width:0.5;" width="247.9922" x="236" y="465.538"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="105.0479" x="246" y="488.6699">Protected history</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="227.9922" x="246" y="504.7685">Values, names, sensitivity and Trash</text></g><!--entity APPS--><g class="entity" data-qualified-name="APPS" data-source-line="11" id="ent0001"><rect fill="#E3F2FD" height="36.0986" rx="6" ry="6" style="stroke:#181818;stroke-width:0.5;" width="89.2617" x="343.37" y="50.998"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="69.2617" x="353.37" y="74.1299">Other apps</text></g><!--entity USER--><g class="entity" data-qualified-name="USER" data-source-line="19" id="ent0008"><ellipse cx="19" cy="462.088" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M19,470.088 L19,497.088 M6,478.088 L32,478.088 M19,497.088 L6,512.088 M19,497.088 L32,512.088" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="24.9102" x="6.5449" y="526.7199">You</text></g><g class="entity" data-qualified-name="GMN11" data-source-line="24" id="ent0012"><path d="M515.82,186.998 L515.82,206.148 L413.33,210.148 L515.82,214.148 L515.82,233.2939 A6,6 0 0 0 521.82,239.2939 L824.1774,239.2939 A6,6 0 0 0 830.1774,233.2939 L830.1774,190.998 L820.1774,180.998 L521.82,180.998 A6,6 0 0 0 515.82,186.998" fill="#FFF3E0" style="stroke:#181818;stroke-width:0.5;"/><path d="M820.1774,180.998 L820.1774,187.998 A3,3 0 0 0 823.1774,190.998 L830.1774,190.998 L820.1774,180.998" fill="#FFF3E0" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="167.3369" x="521.82" y="199.1299">Listening must be enabled.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="293.3574" x="521.82" y="215.2285">Exclusions and private-content filters still apply.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="275.4678" x="521.82" y="231.3271">Access or storage errors can pause capture.</text></g><g class="entity" data-qualified-name="GMN14" data-source-line="29" id="ent0015"><path d="M516.19,323.298 L516.19,342.438 L380.48,346.438 L516.19,350.438 L516.19,369.5939 A6,6 0 0 0 522.19,375.5939 L809.8023,375.5939 A6,6 0 0 0 815.8023,369.5939 L815.8023,327.298 L805.8023,317.298 L522.19,317.298 A6,6 0 0 0 516.19,323.298" fill="#E1F5FE" style="stroke:#181818;stroke-width:0.5;"/><path d="M805.8023,317.298 L805.8023,324.298 A3,3 0 0 0 808.8023,327.298 L815.8023,327.298 L805.8023,317.298" fill="#E1F5FE" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="249.0469" x="522.19" y="335.4299">Locked history does not pause listening.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="256.7988" x="522.19" y="351.5285">The collector has a public encryption key,</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="278.6123" x="522.19" y="367.6271">but cannot decrypt history or pending copies.</text></g><!--link CAPTURE to INBOX--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="16" id="lnk6"><path d="M376.16,234.538 C362.61,261.288 343.0085,299.9972 330.9485,323.8172" fill="none" id="CAPTURE-to-INBOX" style="stroke:#455A64;stroke-w