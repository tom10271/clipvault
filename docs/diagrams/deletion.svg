ont-size="14" lengthAdjust="spacing" textLength="91.8066" x="338.77" y="317.5299">Removed from</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="100.3857" x="338.77" y="333.6285">the current vault</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="15" id="ent0004"><ellipse cx="214.96" cy="71.098" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN11" data-source-line="22" id="ent0012"><path d="M259.68,49.998 L259.68,92.1953 A0,0 0 0 0 259.68,92.1953 L387.38,92.1953 L389.67,153.008 L395.38,92.1953 L524.2376,92.1953 A0,0 0 0 0 524.2376,92.1953 L524.2376,59.998 L514.2376,49.998 L259.68,49.998 A0,0 0 0 0 259.68,49.998" fill="#E1F5FE" style="stroke:#181818;stroke-width:0.5;"/><path d="M514.2376,49.998 L514.2376,59.998 L524.2376,59.998 L514.2376,49.998" fill="#E1F5FE" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="235.751" x="265.68" y="68.1299">Names and sensitivity survive restore.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="243.5576" x="265.68" y="84.2285">Retention limits can also expire entries.</text></g><g class="entity" data-qualified-name="GMN14" data-source-line="26" id="ent0015"><path d="M6,304.398 L6,346.5953 L293.916,346.5953 L293.916,314.398 L283.916,304.398 L6,304.398" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M283.916,304.398 L283.916,314.398 L293.916,314.398 L283.916,304.398" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="266.916" x="12" y="322.5299">Manual Trash or permanent deletion clears</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="249.7715" x="12" y="338.6285">the clipboard only if its text still matches.</text></g><g class="entity" data-qualified-name="GMN17" data-source-line="30" id="ent0018"><path d="M256.68,412.588 L256.68,470.8839 A0,0 0 0 0 256.68,470.8839 L521.2445,470.8839 A0,0 0 0 0 521.2445,470.8839 L521.2445,422.588 L511.2445,412.588 L392.96,412.588 L388.96,351.848 L384.96,412.588 L256.68,412.588 A0,0 0 0 0 256.68,412.588" fill="#FFEBEE" style="stroke:#181818;stroke-width:0.5;"/><path d="M511.2445,412.588 L511.2445,422.588 L521.2445,422.588 L511.2445,412.588" fill="#FFEBEE" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="239.6748" x="262.68" y="430.7199">Only after a successful snapshot save.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="242.0127" x="262.68" y="446.8185">Failed saves keep the previous history.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="243.5645" x="262.68" y="462.9171">Other copies and backups may remain.</text></g><!--link *start* to HISTORY--><g class="link" data-entity-1="ent0004" data-entity-2="ent0001" data-link-type="dependency" data-source-line="15" id="lnk5"><path d="M215.22,81.528 C215.68,97.668 216.4788,126.09 217.1288,149.1" fill="none" id="*start*-to-HISTORY" style="stroke:#455A64;stroke-width:1;"/><polygon fill="#455A64" points="217.27,154.098,221.0143,144.9887,217.1288,149.1,213.0175,145.2146,217.27,154.098" style="stroke:#455A64;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link HISTORY to TRASH--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="16" id="lnk6"><path d="M250.21,193.648 C257.82,196.398 266.01,198.868 273.87,200.298 C293.65,203.888 310.4558,202.6281 329.6258,198.4281" fill="none" id="HISTORY-to-TRASH" style="stroke:#455A64;stroke-width:1;"/><polygon fill="#455A64" points="334.51,197.358,324.8625,195.3769,329.6258,198.4281,326.5746,203.191